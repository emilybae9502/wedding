
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wp{padding:0.5rem 0}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.tab-btn{padding:18px 8px;border-radius:16px;border:2.5px solid #7F77DD;background:var(--color-background-primary);font-size:20px;cursor:pointer;color:#534AB7;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;line-height:1}
.tab-btn i{font-size:24px}
.tab-btn.on{background:#26215C;color:#fff;border-color:#26215C}

.sec{display:none}
.sec.on{display:block}

.prog-wrap{margin-bottom:1.5rem}
.prog-top{display:flex;justify-content:space-between;margin-bottom:10px;font-size:20px;color:var(--color-text-secondary);font-weight:500}
.prog-bar{height:14px;background:var(--color-background-secondary);border-radius:7px;overflow:hidden}
.prog-fill{height:100%;background:#534AB7;border-radius:7px;transition:width 0.4s}

.phase-block{margin-bottom:12px;border-radius:18px;overflow:hidden;border:1.5px solid var(--color-border-tertiary)}
.phase-hd{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;min-height:64px}
.phase-label{flex:1;font-size:22px;font-weight:600}
.phase-badge{font-size:16px;padding:5px 13px;border-radius:20px;background:rgba(255,255,255,0.22);white-space:nowrap}
.phase-count{font-size:16px;opacity:0.75;white-space:nowrap}
.phase-chev{font-size:22px;opacity:0.75;transition:transform 0.2s;flex-shrink:0}

.ci{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;border-top:1px solid rgba(0,0,0,0.07);cursor:pointer;min-height:64px}
.chkbox{width:32px;height:32px;border-radius:8px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.chkbox i{font-size:20px;color:#fff;display:none}
.ci.done .chkbox i{display:block}
.ci-text{font-size:20px;line-height:1.45;flex:1;font-weight:500}
.ci.done .ci-text{text-decoration:line-through;opacity:0.5}
.ci-note{font-size:16px;margin-top:5px;opacity:0.6;font-weight:400}

.tot-row{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;padding:18px 20px;background:var(--color-background-secondary);border-radius:16px}
.tot-label{font-size:20px;color:var(--color-text-secondary);font-weight:500;white-space:nowrap}
.tot-inp{border:2.5px solid #7F77DD;border-radius:12px;padding:13px 14px;font-size:24px;font-weight:600;background:var(--color-background-primary);color:var(--color-text-primary);flex:1;min-width:0;text-align:right}
.tot-inp:focus{outline:none;border-color:#26215C}
.tot-unit{font-size:20px;color:var(--color-text-secondary);font-weight:500;white-space:nowrap}

.bcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.bcard{background:var(--color-background-secondary);border-radius:14px;padding:16px 18px}
.bcard-label{font-size:16px;color:var(--color-text-secondary);margin-bottom:6px;font-weight:500}
.bcard-val{font-size:26px;font-weight:600;color:var(--color-text-primary)}
.bcard-val.over{color:#A32D2D}
.bcard-val.ok{color:#0F6E56}

.b-table{border:2.5px solid #7F77DD;border-radius:18px;overflow:hidden;background:var(--color-background-primary)}
.b-item{padding:18px 20px;border-bottom:1.5px solid #EEEDFE}
.b-item:last-child{border-bottom:none}
.b-item-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.b-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.b-item-label{font-size:19px;font-weight:600;color:var(--color-text-primary);flex:1;line-height:1.3}
.b-stat{font-size:16px;padding:8px 16px;border-radius:20px;cursor:pointer;border:none;font-family:var(--font-sans);white-space:nowrap;font-weight:600;min-height:44px}
.b-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b-inp-wrap{display:flex;flex-direction:column;gap:6px}
.b-inp-label{font-size:16px;color:var(--color-text-secondary);font-weight:500}
.b-inp{width:100%;border:2.5px solid #AFA9EC;border-radius:12px;padding:13px 14px;font-size:22px;font-weight:600;background:var(--color-background-primary);color:var(--color-text-primary);text-align:right}
.b-inp:focus{outline:none;border-color:#26215C}

.add-btn{margin-top:14px;width:100%;padding:18px;border-radius:14px;border:2.5px dashed #7F77DD;background:transparent;color:#534AB7;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.add-btn:hover{background:#EEEDFE}
.add-btn i{font-size:22px}

.v-card{background:var(--color-background-primary);border:2.5px solid #7F77DD;border-radius:18px;padding:18px 20px;margin-bottom:12px}
.v-cat{font-size:17px;color:#534AB7;margin-bottom:12px;font-weight:600}
.v-inp{width:100%;border:2.5px solid #AFA9EC;border-radius:12px;padding:13px 14px;font-size:19px;background:var(--color-background-primary);color:var(--color-text-primary);margin-bottom:10px;font-family:var(--font-sans)}
.v-inp:focus{outline:none;border-color:#26215C}
.stars{display:flex;gap:8px;margin-top:8px}
.star{font-size:34px;cursor:pointer;color:#CECBF6;line-height:1}
.star.lit{color:#BA7517}
.del-btn{background:none;border:none;cursor:pointer;color:#AFA9EC;padding:6px;border-radius:8px;font-size:22px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.del-btn:hover{color:#A32D2D}

.memo-area{width:100%;min-height:240px;border:2.5px solid #7F77DD;border-radius:14px;padding:16px;font-size:19px;background:var(--color-background-primary);color:var(--color-text-primary);resize:vertical;font-family:var(--font-sans);line-height:1.7}
.memo-area:focus{outline:none;border-color:#26215C}
.sec-lbl{font-size:18px;color:#534AB7;margin-bottom:12px;font-weight:600}
</style>

<div class="wp">
<h2 class="sr-only">웨딩 플래너</h2>

<div class="tabs">
  <button class="tab-btn on" onclick="sw('cl',this)"><i class="ti ti-checklist" aria-hidden="true"></i>체크리스트</button>
  <button class="tab-btn" onclick="sw('bu',this)"><i class="ti ti-receipt" aria-hidden="true"></i>예산</button>
  <button class="tab-btn" onclick="sw('ve',this)"><i class="ti ti-building-store" aria-hidden="true"></i>업체</button>
  <button class="tab-btn" onclick="sw('mo',this)"><i class="ti ti-notes" aria-hidden="true"></i>메모</button>
</div>

<div class="sec on" id="s-cl">
  <div class="prog-wrap">
    <div class="prog-top"><span>진행률</span><span id="prog-txt">0 / 0</span></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div id="cl-container"></div>
</div>

<div class="sec" id="s-bu">
  <div class="tot-row">
    <span class="tot-label">총 예산</span>
    <input class="tot-inp" type="number" id="tot-b" placeholder="0" oninput="updBudget()">
    <span class="tot-unit">만원</span>
  </div>
  <div class="bcard-grid">
    <div class="bcard"><div class="bcard-label">총 예산</div><div class="bcard-val" id="b-tot">—</div></div>
    <div class="bcard"><div class="bcard-label">지출 예정</div><div class="bcard-val" id="b-plan">0</div></div>
    <div class="bcard"><div class="bcard-label">실제 지출</div><div class="bcard-val" id="b-actual">0</div></div>
    <div class="bcard"><div class="bcard-label">남은 예산</div><div class="bcard-val" id="b-rem">—</div></div>
  </div>
  <div class="b-table"><div id="b-body"></div></div>
  <button class="add-btn" onclick="addBRow()"><i class="ti ti-plus" aria-hidden="true"></i>항목 추가</button>
</div>

<div class="sec" id="s-ve">
  <div id="v-container"></div>
  <button class="add-btn" onclick="addVendor()"><i class="ti ti-plus" aria-hidden="true"></i>업체 추가</button>
</div>

<div class="sec" id="s-mo">
  <div class="sec-lbl">자유 메모</div>
  <textarea class="memo-area" placeholder="피팅 일정, 신혼여행 메모 등 자유롭게..."></textarea>
</div>
</div>

<script>
const phases=[
  {label:'2026.05',badge:'D-10개월',hd:'#EEEDFE',hdText:'#3C3489',itemBg:'#F6F5FE',itemText:'#3C3489',itemNote:'#7F77DD',chkActive:'#534AB7',
   items:[{t:'웨딩홀 후보 리스트 작성',n:'성수기(봄·가을) 피하면 예약 수월'},{t:'결혼식 날짜 확정 (2027.3.20)',n:''},{t:'전체 예산 계획 수립',n:'예산 탭 참고'},{t:'웨딩홀 투어 및 계약',n:'보증금·위약금 조건 확인'},{t:'스드메 패키지 비교 및 계약',n:'스튜디오 토탈 패키지 기준'}]},
  {label:'2026.06',badge:'D-9개월',hd:'#CECBF6',hdText:'#26215C',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#3C3489',
   items:[{t:'스튜디오 촬영 날짜 확정',n:'2026.10 촬영 예정'},{t:'본식 사진·영상 촬영팀 계약',n:''},{t:'청첩장 디자인 컨셉 결정',n:''}]},
  {label:'2026.08',badge:'D-7개월',hd:'#AFA9EC',hdText:'#26215C',itemBg:'#CECBF6',itemText:'#26215C',itemNote:'#3C3489',chkActive:'#26215C',
   items:[{t:'예물·예단 준비 시작',n:''}]},
  {label:'2026.09',badge:'D-6개월',hd:'#7F77DD',hdText:'#fff',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#534AB7',
   items:[{t:'스튜디오 촬영 준비 (의상·소품)',n:'촬영 2026.10'},{t:'청첩장 인쇄 및 발송',n:'하객 주소 미리 수집'},{t:'웨딩 반지 결정',n:''}]},
  {label:'2026.10',badge:'촬영',hd:'#534AB7',hdText:'#fff',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#534AB7',
   items:[{t:'스튜디오 본 촬영 진행',n:'2026.10 확정'},{t:'드레스 피팅 1차',n:''},{t:'본식 메이크업 리허설',n:''}]},
  {label:'2026.12',badge:'D-3개월',hd:'#3C3489',hdText:'#fff',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#26215C',
   items:[{t:'신혼여행 예약',n:'항공권 일찍 예약할수록 유리'},{t:'식순(프로그램) 확정',n:'사회자와 함께'},{t:'피로연 시식',n:'예식 약 3개월 전'}]},
  {label:'2027.01',badge:'D-2개월',hd:'#26215C',hdText:'#CECBF6',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#534AB7',
   items:[{t:'드레스 피팅 2차 (최종 수선)',n:''},{t:'하객 인원 최종 취합',n:'식사 보증인원 확정'},{t:'감사 선물 준비',n:'부모님·도우미'},{t:'웨딩홀·업체 최종 미팅',n:''}]},
  {label:'2027.02',badge:'D-1개월',hd:'#26215C',hdText:'#AFA9EC',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#534AB7',
   items:[{t:'최종 식순 리허설',n:'사회자와 확인'},{t:'신혼여행 짐 준비 시작',n:''},{t:'도우미 역할 배분 확정',n:''}]},
  {label:'2027.03.13~19',badge:'D-1주일',hd:'#1a1840',hdText:'#7F77DD',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#534AB7',
   items:[{t:'전날 짐 세팅',n:'드레스·슈즈·반지·화장품'},{t:'도우미 역할 배분 최종 공유',n:''},{t:'축의금 봉투·방명록 준비',n:''},{t:'스냅 기사님 동선 공유',n:''}]},
  {label:'2027.03.20',badge:'D-Day',hd:'#0d0c22',hdText:'#CECBF6',itemBg:'#EEEDFE',itemText:'#26215C',itemNote:'#534AB7',chkActive:'#534AB7',
   items:[{t:'메이크업 시작',n:'예식 4~5시간 전'},{t:'웨딩홀 도착 및 최종 점검',n:''},{t:'가족 단체 사진 촬영',n:''},{t:'예식 진행',n:''},{t:'피로연 진행',n:''},{t:'신혼여행 출발',n:''}]},
];

let checks={},collapsed={};

function renderCL(){
  const con=document.getElementById('cl-container');
  con.innerHTML='';
  let tot=0,done=0;
  phases.forEach((ph,pi)=>{
    ph.items.forEach((_,ii)=>{tot++;if(checks[pi+'-'+ii])done++;});
    const phDone=ph.items.filter((_,ii)=>checks[pi+'-'+ii]).length;
    const isCol=collapsed[pi];
    const block=document.createElement('div');
    block.className='phase-block';
    block.style.borderColor=ph.hd;
    const hd=document.createElement('div');
    hd.className='phase-hd';
    hd.style.background=ph.hd;
    hd.innerHTML=`
      <span class="phase-label" style="color:${ph.hdText}">${ph.label}</span>
      <span class="phase-badge" style="color:${ph.hdText}">${ph.badge}</span>
      <span class="phase-count" style="color:${ph.hdText}">${phDone}/${ph.items.length}</span>
      <i class="ti ti-chevron-down phase-chev" style="color:${ph.hdText};transform:${isCol?'rotate(-90deg)':''}" aria-hidden="true"></i>`;
    hd.onclick=()=>{collapsed[pi]=!collapsed[pi];renderCL()};
    block.appendChild(hd);
    if(!isCol){
      ph.items.forEach((item,ii)=>{
        const k=pi+'-'+ii,isDone=checks[k];
        const div=document.createElement('div');
        div.className='ci'+(isDone?' done':'');
        div.style.background=ph.itemBg;
        div.innerHTML=`
          <div class="chkbox" style="border:2.5px solid ${isDone?ph.chkActive:ph.chkActive+'55'};background:${isDone?ph.chkActive:'transparent'}">
            <i class="ti ti-check" aria-hidden="true"></i>
          </div>
          <div style="flex:1">
            <div class="ci-text" style="color:${isDone?ph.itemNote:ph.itemText}">${item.t}</div>
            ${item.n?`<div class="ci-note" style="color:${ph.itemNote}">${item.n}</div>`:''}
          </div>`;
        div.onclick=()=>{checks[k]=!checks[k];renderCL()};
        block.appendChild(div);
      });
    }
    con.appendChild(block);
  });
  const pct=tot?Math.round(done/tot*100):0;
  document.getElementById('prog-txt').textContent=`${done}/${tot} (${pct}%)`;
  document.getElementById('prog-fill').style.width=pct+'%';
}

let bRows=[
  {label:'웨딩홀 + 본식 사진·영상',color:'#534AB7',budget:'',actual:'',status:'미납'},
  {label:'스드메 (스튜디오·드레스·메이크업)',color:'#7F77DD',budget:'',actual:'',status:'미납'},
  {label:'신혼여행',color:'#AFA9EC',budget:'',actual:'',status:'미납'},
  {label:'예물·예단',color:'#3C3489',budget:'',actual:'',status:'미납'},
  {label:'청첩장',color:'#26215C',budget:'',actual:'',status:'미납'},
  {label:'기타',color:'#888780',budget:'',actual:'',status:'미납'},
];
const statuses=['미납','일부','완납'];
const stColors={미납:{bg:'#F1EFE8',c:'#444441'},일부:{bg:'#FAEEDA',c:'#633806'},완납:{bg:'#E1F5EE',c:'#085041'}};

function renderBudget(){
  const body=document.getElementById('b-body');
  body.innerHTML='';
  bRows.forEach((r,i)=>{
    const sc=stColors[r.status];
    const item=document.createElement('div');
    item.className='b-item';
    item.innerHTML=`
      <div class="b-item-top">
        <div class="b-dot" style="background:${r.color}"></div>
        <span class="b-item-label">${r.label}</span>
        <button class="b-stat" style="background:${sc.bg};color:${sc.c}" onclick="cycleStatus(${i})">${r.status}</button>
      </div>
      <div class="b-inputs">
        <div class="b-inp-wrap">
          <span class="b-inp-label">예상 (만원)</span>
          <input class="b-inp" type="number" placeholder="0" value="${r.budget}" oninput="bRows[${i}].budget=this.value;updBudget()">
        </div>
        <div class="b-inp-wrap">
          <span class="b-inp-label">실제 (만원)</span>
          <input class="b-inp" type="number" placeholder="0" value="${r.actual}" oninput="bRows[${i}].actual=this.value;updBudget()">
        </div>
      </div>`;
    body.appendChild(item);
  });
  updBudget();
}

function cycleStatus(i){bRows[i].status=statuses[(statuses.indexOf(bRows[i].status)+1)%3];renderBudget()}
function addBRow(){bRows.push({label:'새 항목',color:'#AFA9EC',budget:'',actual:'',status:'미납'});renderBudget()}

function updBudget(){
  const tot=parseFloat(document.getElementById('tot-b').value)||0;
  let plan=0,actual=0;
  bRows.forEach(r=>{plan+=parseFloat(r.budget)||0;actual+=parseFloat(r.actual)||0;});
  const rem=tot-actual;
  document.getElementById('b-tot').textContent=tot?tot.toLocaleString():'—';
  document.getElementById('b-plan').textContent=plan.toLocaleString();
  document.getElementById('b-actual').textContent=actual.toLocaleString();
  const el=document.getElementById('b-rem');
  el.textContent=tot?rem.toLocaleString():'—';
  el.className='bcard-val'+(tot?(rem<0?' over':' ok'):'');
}

let vendors=[
  {cat:'웨딩홀 + 본식 사진·영상',name:'',phone:'',note:'',rating:0},
  {cat:'스드메 (스튜디오·드레스·메이크업)',name:'',phone:'',note:'',rating:0},
  {cat:'신혼여행',name:'',phone:'',note:'',rating:0},
  {cat:'예물·예단',name:'',phone:'',note:'',rating:0},
];
let vInited=false;

function renderVendors(){
  const con=document.getElementById('v-container');
  con.innerHTML='';
  vendors.forEach((v,i)=>{
    const card=document.createElement('div');
    card.className='v-card';
    const stars=[1,2,3,4,5].map(s=>`<span class="star ${v.rating>=s?'lit':''}" onclick="setRating(${i},${s})">★</span>`).join('');
    card.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="v-cat">${v.cat}</div>
        <button class="del-btn" onclick="vendors.splice(${i},1);renderVendors()" aria-label="삭제"><i class="ti ti-x"></i></button>
      </div>
      <input class="v-inp" placeholder="업체명" value="${v.name}" oninput="vendors[${i}].name=this.value">
      <input class="v-inp" placeholder="연락처" value="${v.phone}" oninput="vendors[${i}].phone=this.value">
      <input class="v-inp" placeholder="메모 (담당자, 계약금 등)" value="${v.note}" oninput="vendors[${i}].note=this.value">
      <div class="stars">${stars}</div>`;
    con.appendChild(card);
  });
}

function setRating(i,r){vendors[i].rating=r;renderVendors()}
function addVendor(){vendors.push({cat:'새 업체',name:'',phone:'',note:'',rating:0});renderVendors()}

function sw(id,btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('s-'+id).classList.add('on');
  btn.classList.add('on');
  if(id==='bu'&&!document.getElementById('b-body').children.length)renderBudget();
  if(id==='ve'&&!vInited){vInited=true;renderVendors();}
}

renderCL();
</script>
