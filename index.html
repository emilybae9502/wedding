<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💍 우리 웨딩 플래너</title>
<style>
:root{
  --p1:#EEEDFE;--p2:#CECBF6;--p3:#AFA9EC;--p4:#7F77DD;
  --p5:#534AB7;--p6:#3C3489;--p7:#26215C;--p8:#1a1840;--p9:#0d0c22;
  --text:#1a1a2e;--muted:#888;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fafafa;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--text)}

.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:#fff;border-top:2px solid var(--p4);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px 0 10px;gap:5px;cursor:pointer;border:none;background:none;
  color:var(--p3);font-size:11px;font-weight:600;
}
.tab svg{width:26px;height:26px;stroke:var(--p3);fill:none;stroke-width:1.8}
.tab.on{color:var(--p7)}
.tab.on svg{stroke:var(--p7)}

.page{display:none;padding:0 0 110px;min-height:100dvh}
.page.on{display:block}
.page-title{
  position:sticky;top:0;z-index:50;
  background:var(--p7);color:#fff;
  padding:20px 20px 16px;
  font-size:26px;font-weight:700;letter-spacing:-.5px;
}
.page-title small{display:block;font-size:14px;font-weight:400;opacity:.7;margin-top:3px}

.prog-wrap{padding:20px 20px 14px;background:var(--p1)}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-label{font-size:16px;font-weight:600;color:var(--p7)}
.prog-count{font-size:16px;font-weight:700;color:var(--p5)}
.prog-bar{height:12px;background:var(--p2);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;background:var(--p6);border-radius:6px;transition:width .4s}

/* 드래그 힌트 */
.drag-hint{
  text-align:center;font-size:13px;color:var(--p4);
  padding:10px 20px 2px;font-weight:500;
}

.phase{margin:16px 16px 0;border-radius:18px;overflow:hidden;border:1.5px solid var(--p3)}
.phase.drag-over{border:2.5px dashed var(--p4);background:var(--p1)}
.phase-hd{
  display:flex;align-items:center;gap:12px;
  padding:18px 20px;cursor:pointer;user-select:none;
}
.phase-hd-left{flex:1}
.phase-hd-month{font-size:22px;font-weight:700}
.phase-hd-badge{font-size:14px;font-weight:500;opacity:.75;margin-top:2px}
.phase-hd-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.phase-cnt{font-size:16px;font-weight:600}
.phase-chev{font-size:22px;transition:transform .2s;line-height:1}
.phase-chev.closed{transform:rotate(-90deg)}

.phase-items{border-top:1px solid rgba(0,0,0,.08)}

/* 드롭 위치 표시선 */
.drop-indicator{
  height:3px;background:var(--p4);border-radius:2px;
  margin:0 16px;display:none;
}
.drop-indicator.show{display:block}

.ci{
  display:flex;align-items:center;gap:12px;
  padding:16px 12px 16px 20px;
  border-bottom:1px solid rgba(0,0,0,.06);
  background:#fff;
  transition:opacity .15s, transform .15s;
  cursor:default;
}
.ci.dragging{opacity:.35;transform:scale(.98)}
.ci.drag-above{border-top:3px solid var(--p4)}
.ci.drag-below{border-bottom:3px solid var(--p4)}

/* 드래그 핸들 */
.drag-handle{
  width:32px;height:44px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:grab;touch-action:none;
  color:var(--p3);
}
.drag-handle:active{cursor:grabbing}
.drag-handle span{display:block;width:18px;height:2px;background:currentColor;border-radius:1px}

.chk{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  border:2.5px solid var(--p3);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;cursor:pointer;
}
.chk svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;display:none}
.ci.done .chk{background:var(--p5);border-color:var(--p5)}
.ci.done .chk svg{display:block}
.ci-body{flex:1;cursor:pointer;min-width:0}
.ci-text{font-size:18px;font-weight:500;line-height:1.45;color:var(--text)}
.ci.done .ci-text{text-decoration:line-through;color:var(--p3)}
.ci-note{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.del-btn{
  background:none;border:none;cursor:pointer;
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#ccc;flex-shrink:0;
}
.del-btn:active{color:#e24b4a}

/* 고스트 (드래그 중 따라다니는 복사본) */
#ghost{
  position:fixed;z-index:9999;pointer-events:none;
  background:#fff;border:2px solid var(--p4);border-radius:14px;
  padding:14px 18px;
  font-size:17px;font-weight:500;color:var(--text);
  box-shadow:0 8px 24px rgba(83,74,183,.25);
  max-width:320px;opacity:.92;
  display:none;
}

.add-item-row{
  display:flex;gap:8px;padding:12px 14px;
  background:#f8f7ff;border-top:1px dashed var(--p3);
}
.add-item-inp{
  flex:1;border:1.5px solid var(--p3);border-radius:10px;
  padding:11px 14px;font-size:16px;color:var(--text);
  background:#fff;outline:none;font-family:inherit;
}
.add-item-inp:focus{border-color:var(--p5)}
.add-item-btn{
  background:var(--p5);border:none;border-radius:10px;
  padding:11px 18px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;
}
.add-item-btn:active{background:var(--p6)}

/* 예산 */
.budget-hero{background:var(--p7);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bhero-card{background:rgba(255,255,255,.12);border-radius:14px;padding:14px 16px}
.bhero-label{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:6px;font-weight:500}
.bhero-val{font-size:24px;font-weight:700;color:#fff}
.bhero-val.ok{color:#7ee8c0}
.bhero-val.over{color:#f9a8a8}
.tot-section{margin:20px 16px 0}
.tot-label{font-size:16px;font-weight:600;color:var(--p7);margin-bottom:8px}
.tot-inp-wrap{display:flex;align-items:center;gap:10px;border:2.5px solid var(--p4);border-radius:14px;padding:14px 18px;background:#fff}
.tot-inp-wrap input{flex:1;border:none;outline:none;font-size:28px;font-weight:700;color:var(--p7);background:transparent;min-width:0}
.tot-inp-wrap span{font-size:20px;font-weight:600;color:var(--p4)}
.b-list{margin:20px 16px 0;display:flex;flex-direction:column;gap:12px}
.b-card{background:#fff;border:2px solid var(--p3);border-radius:18px;padding:18px 20px}
.b-card-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.b-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.b-name{flex:1;font-size:17px;font-weight:600;line-height:1.3}
.b-stat-btn{font-size:14px;font-weight:600;padding:7px 14px;border-radius:20px;border:none;cursor:pointer;white-space:nowrap}
.b-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b-field{display:flex;flex-direction:column;gap:6px}
.b-field label{font-size:14px;font-weight:500;color:var(--muted)}
.b-field input{border:2px solid var(--p3);border-radius:12px;padding:12px 14px;font-size:22px;font-weight:700;color:var(--p7);background:#fff;text-align:right;outline:none;width:100%}
.b-field input:focus{border-color:var(--p6)}
.add-btn{
  margin:16px 16px 0;width:calc(100% - 32px);padding:18px;border-radius:14px;
  border:2.5px dashed var(--p4);background:transparent;
  color:var(--p5);font-size:18px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-btn:active{background:var(--p1)}

/* 업체 */
.v-list{margin:16px 16px 0;display:flex;flex-direction:column;gap:14px}
.v-card{background:#fff;border:2px solid var(--p3);border-radius:18px;padding:18px 20px}
.v-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.v-cat{font-size:16px;font-weight:700;color:var(--p5)}
.v-del{background:none;border:none;font-size:22px;color:var(--p3);cursor:pointer;padding:4px;min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center}
.v-inp{width:100%;border:2px solid var(--p2);border-radius:12px;padding:14px 16px;font-size:17px;color:var(--text);margin-bottom:10px;outline:none;background:#fff;font-family:inherit}
.v-inp:focus{border-color:var(--p5)}
.v-inp:last-of-type{margin-bottom:8px}
.stars{display:flex;gap:8px}
.star{font-size:36px;color:#ddd;cursor:pointer;line-height:1}
.star.lit{color:#f0a500}

/* 메모 */
.memo-wrap{padding:20px 16px}
.memo-label{font-size:18px;font-weight:700;color:var(--p7);margin-bottom:12px}
.memo-area{
  width:100%;min-height:300px;border:2.5px solid var(--p4);border-radius:16px;
  padding:18px;font-size:17px;line-height:1.7;
  color:var(--text);background:#fff;resize:vertical;outline:none;font-family:inherit;
}
.memo-area:focus{border-color:var(--p6)}
</style>
</head>
<body>

<div id="ghost"></div>

<nav class="tabbar">
  <button class="tab on" onclick="sw('cl',this)">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    체크리스트
  </button>
  <button class="tab" onclick="sw('bu',this)">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
    예산
  </button>
  <button class="tab" onclick="sw('ve',this)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    업체
  </button>
  <button class="tab" onclick="sw('mo',this)">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    메모
  </button>
</nav>

<div class="page on" id="p-cl">
  <div class="page-title">
    💍 웨딩 체크리스트
    <small>2027.03.20 결혼식</small>
  </div>
  <div class="prog-wrap">
    <div class="prog-row">
      <span class="prog-label">전체 진행률</span>
      <span class="prog-count" id="prog-txt">0 / 0</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="drag-hint">☰ 핸들을 길게 누른 채 드래그해서 순서 변경</div>
  <div id="cl-wrap" style="padding-bottom:8px"></div>
</div>

<div class="page" id="p-bu">
  <div class="page-title">💰 예산 관리<small>단위: 만원</small></div>
  <div class="budget-hero">
    <div class="bhero-card"><div class="bhero-label">총 예산</div><div class="bhero-val" id="bh-tot">—</div></div>
    <div class="bhero-card"><div class="bhero-label">지출 예정</div><div class="bhero-val" id="bh-plan">0</div></div>
    <div class="bhero-card"><div class="bhero-label">실제 지출</div><div class="bhero-val" id="bh-actual">0</div></div>
    <div class="bhero-card"><div class="bhero-label">남은 예산</div><div class="bhero-val" id="bh-rem">—</div></div>
  </div>
  <div class="tot-section">
    <div class="tot-label">총 예산 설정</div>
    <div class="tot-inp-wrap">
      <input type="number" id="tot-b" placeholder="0" inputmode="numeric" oninput="updBudget()">
      <span>만원</span>
    </div>
  </div>
  <div class="b-list" id="b-list"></div>
  <button class="add-btn" onclick="addBRow()">＋ 항목 추가</button>
  <div style="height:20px"></div>
</div>

<div class="page" id="p-ve">
  <div class="page-title">🏬 업체 정보</div>
  <div class="v-list" id="v-list"></div>
  <button class="add-btn" onclick="addVendor()" style="margin-top:14px">＋ 업체 추가</button>
  <div style="height:20px"></div>
</div>

<div class="page" id="p-mo">
  <div class="page-title">📝 메모</div>
  <div class="memo-wrap">
    <div class="memo-label">자유 메모</div>
    <textarea class="memo-area" placeholder="피팅 일정, 신혼여행 준비물 등 자유롭게..."></textarea>
  </div>
</div>

<script>
const phases=[
  {label:'2026.05',badge:'D-10개월',hd:'#EEEDFE',hdText:'#3C3489',chkActive:'#534AB7',
   items:[{t:'웨딩홀 후보 리스트 작성',n:'성수기(봄·가을) 피하면 예약 수월'},{t:'결혼식 날짜 확정 (2027.3.20)',n:''},{t:'전체 예산 계획 수립',n:'예산 탭 참고'},{t:'웨딩홀 투어 및 계약',n:'보증금·위약금 조건 확인'},{t:'스드메 패키지 비교 및 계약',n:'스튜디오 토탈 패키지 기준'}]},
  {label:'2026.06',badge:'D-9개월',hd:'#CECBF6',hdText:'#26215C',chkActive:'#3C3489',
   items:[{t:'스튜디오 촬영 날짜 확정',n:'2026.10 촬영 예정'},{t:'본식 사진·영상 촬영팀 계약',n:''},{t:'청첩장 디자인 컨셉 결정',n:''}]},
  {label:'2026.08',badge:'D-7개월',hd:'#AFA9EC',hdText:'#26215C',chkActive:'#26215C',
   items:[{t:'예물·예단 준비 시작',n:''}]},
  {label:'2026.09',badge:'D-6개월',hd:'#7F77DD',hdText:'#fff',chkActive:'#534AB7',
   items:[{t:'스튜디오 촬영 준비 (의상·소품)',n:'촬영 2026.10'},{t:'청첩장 인쇄 및 발송',n:'하객 주소 미리 수집'},{t:'웨딩 반지 결정',n:''}]},
  {label:'2026.10',badge:'촬영',hd:'#534AB7',hdText:'#fff',chkActive:'#534AB7',
   items:[{t:'스튜디오 본 촬영 진행',n:'2026.10 확정'},{t:'드레스 피팅 1차',n:''},{t:'본식 메이크업 리허설',n:''}]},
  {label:'2026.12',badge:'D-3개월',hd:'#3C3489',hdText:'#fff',chkActive:'#26215C',
   items:[{t:'신혼여행 예약',n:'항공권 일찍 예약할수록 유리'},{t:'식순(프로그램) 확정',n:'사회자와 함께'},{t:'피로연 시식',n:'예식 약 3개월 전'}]},
  {label:'2027.01',badge:'D-2개월',hd:'#26215C',hdText:'#CECBF6',chkActive:'#534AB7',
   items:[{t:'드레스 피팅 2차 (최종 수선)',n:''},{t:'하객 인원 최종 취합',n:'식사 보증인원 확정'},{t:'감사 선물 준비',n:'부모님·도우미'},{t:'웨딩홀·업체 최종 미팅',n:''}]},
  {label:'2027.02',badge:'D-1개월',hd:'#26215C',hdText:'#AFA9EC',chkActive:'#534AB7',
   items:[{t:'최종 식순 리허설',n:'사회자와 확인'},{t:'신혼여행 짐 준비 시작',n:''},{t:'도우미 역할 배분 확정',n:''}]},
  {label:'2027.03.13~19',badge:'D-1주일',hd:'#1a1840',hdText:'#7F77DD',chkActive:'#534AB7',
   items:[{t:'전날 짐 세팅',n:'드레스·슈즈·반지·화장품'},{t:'도우미 역할 배분 최종 공유',n:''},{t:'축의금 봉투·방명록 준비',n:''},{t:'스냅 기사님 동선 공유',n:''}]},
  {label:'2027.03.20',badge:'D-Day 🎉',hd:'#0d0c22',hdText:'#CECBF6',chkActive:'#534AB7',
   items:[{t:'메이크업 시작',n:'예식 4~5시간 전'},{t:'웨딩홀 도착 및 최종 점검',n:''},{t:'가족 단체 사진 촬영',n:''},{t:'예식 진행',n:''},{t:'피로연 진행',n:''},{t:'신혼여행 출발',n:''}]},
];

let checks={}, collapsed={};

// ── 드래그 상태 ──
let drag={
  active:false,
  fromPi:null, fromIi:null,
  item:null,           // {t, n}
  ghost:null,
  startY:0, startX:0,
  scrollInterval:null,
};

function getItemEl(pi, ii){
  return document.querySelector(`[data-pi="${pi}"][data-ii="${ii}"]`);
}

function getAllItemEls(){
  return Array.from(document.querySelectorAll('.ci[data-pi]'));
}

function onDragStart(e, pi, ii){
  e.stopPropagation();
  const touch = e.touches ? e.touches[0] : e;
  drag.active = true;
  drag.fromPi = pi;
  drag.fromIi = ii;
  drag.item = {...phases[pi].items[ii]};
  drag.startY = touch.clientY;
  drag.startX = touch.clientX;

  // 고스트 설정
  const ghost = document.getElementById('ghost');
  ghost.textContent = drag.item.t;
  ghost.style.display = 'block';
  ghost.style.left = (touch.clientX - 20) + 'px';
  ghost.style.top = (touch.clientY - 24) + 'px';

  // 원본 흐리게
  const el = getItemEl(pi, ii);
  if(el) el.classList.add('dragging');

  // 스크롤 자동
  drag.scrollInterval = setInterval(() => {
    const y = drag.lastY || touch.clientY;
    if(y < 120) window.scrollBy(0, -8);
    else if(y > window.innerHeight - 120) window.scrollBy(0, 8);
  }, 30);
}

function onDragMove(e){
  if(!drag.active) return;
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  drag.lastY = touch.clientY;

  // 고스트 이동
  const ghost = document.getElementById('ghost');
  ghost.style.left = (touch.clientX - 20) + 'px';
  ghost.style.top = (touch.clientY - 24) + 'px';

  // 가장 가까운 항목 찾기 → 표시선
  clearDropIndicators();
  const all = getAllItemEls();
  let bestEl = null, bestDist = Infinity, bestPos = 'below';
  all.forEach(el => {
    if(el.dataset.pi == drag.fromPi && el.dataset.ii == drag.fromIi) return;
    const rect = el.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    const dist = Math.abs(touch.clientY - mid);
    if(dist < bestDist){ bestDist = dist; bestEl = el; bestPos = touch.clientY < mid ? 'above' : 'below'; }
  });

  if(bestEl){
    bestEl.classList.add(bestPos === 'above' ? 'drag-above' : 'drag-below');
    drag.targetEl = bestEl;
    drag.targetPos = bestPos;
  }

  // 드래그 중 닫힌 단계 위에 있으면 자동으로 열기
  const phaseEls = Array.from(document.querySelectorAll('.phase'));
  phaseEls.forEach((ph, pi) => {
    if(collapsed[pi]){
      const rect = ph.getBoundingClientRect();
      if(touch.clientY >= rect.top && touch.clientY <= rect.bottom){
        collapsed[pi] = false;
        renderCL();
      }
    }
  });
}

function onDragEnd(e){
  if(!drag.active) return;
  clearInterval(drag.scrollInterval);

  const ghost = document.getElementById('ghost');
  ghost.style.display = 'none';
  clearDropIndicators();

  if(drag.targetEl){
    const toPi = parseInt(drag.targetEl.dataset.pi);
    const toIi = parseInt(drag.targetEl.dataset.ii);
    const pos = drag.targetPos;

    // 실제로 다른 위치면 이동
    const isSameSpot = drag.fromPi === toPi && (
      (pos === 'above' && drag.fromIi === toIi - 1) ||
      (pos === 'below' && drag.fromIi === toIi + 1) ||
      drag.fromIi === toIi
    );

    if(!isSameSpot){
      // 원본에서 제거
      const moved = phases[drag.fromPi].items.splice(drag.fromIi, 1)[0];
      const movedCheck = checks[drag.fromPi+'-'+drag.fromIi];

      // 체크 상태 재정렬 (원본 단계)
      rebuildChecks(drag.fromPi);

      // 삽입 위치 계산
      let insertPi = toPi;
      let insertIi = toIi;

      // 같은 단계에서 위로 올리면 index 보정
      if(drag.fromPi === toPi && drag.fromIi < toIi) insertIi = toIi - 1;
      if(pos === 'below') insertIi = insertIi + 1;
      insertIi = Math.max(0, Math.min(insertIi, phases[insertPi].items.length));

      phases[insertPi].items.splice(insertIi, 0, moved);

      // 체크 상태 재정렬 (대상 단계)
      if(insertPi !== drag.fromPi) rebuildChecks(insertPi);

      // 이동된 항목 체크 상태 복원
      checks[insertPi+'-'+insertIi] = movedCheck;

      collapsed[insertPi] = false;
    }
  }

  drag.active = false;
  drag.targetEl = null;
  renderCL();
}

function rebuildChecks(pi){
  // 해당 단계 체크 상태 초기화 (삽입/삭제 후 인덱스 어긋남 방지)
  const newChecks = {};
  Object.keys(checks).forEach(k => {
    const [p, i] = k.split('-').map(Number);
    if(p !== pi) newChecks[k] = checks[k];
  });
  checks = newChecks;
}

function clearDropIndicators(){
  document.querySelectorAll('.drag-above, .drag-below').forEach(el=>{
    el.classList.remove('drag-above','drag-below');
  });
}

// touch 이벤트는 passive:false 필요
document.addEventListener('touchmove', onDragMove, {passive:false});
document.addEventListener('touchend', onDragEnd);
document.addEventListener('mousemove', onDragMove);
document.addEventListener('mouseup', onDragEnd);

// ── 렌더링 ──
function deleteItem(pi,ii){
  if(!confirm('이 항목을 삭제할까요?')) return;
  phases[pi].items.splice(ii,1);
  rebuildChecks(pi);
  renderCL();
}

function addItem(pi){
  const inp = document.getElementById('ni-'+pi);
  const val = inp && inp.value.trim();
  if(!val) return;
  phases[pi].items.push({t:val, n:''});
  inp.value = '';
  collapsed[pi] = false;
  renderCL();
}

function renderCL(){
  const wrap = document.getElementById('cl-wrap');
  wrap.innerHTML = '';
  let tot=0, done=0;

  phases.forEach((ph, pi) => {
    ph.items.forEach((_,ii) => { tot++; if(checks[pi+'-'+ii]) done++; });
    const phDone = ph.items.filter((_,ii) => checks[pi+'-'+ii]).length;
    const isCol = !!collapsed[pi];
    const light = ['#EEEDFE','#CECBF6','#AFA9EC'].includes(ph.hd);

    const block = document.createElement('div');
    block.className = 'phase';
    block.style.borderColor = light ? '#AFA9EC' : ph.hd;
    block.dataset.phaseIdx = pi;

    const hd = document.createElement('div');
    hd.className = 'phase-hd';
    hd.style.background = ph.hd;
    hd.innerHTML = `
      <div class="phase-hd-left">
        <div class="phase-hd-month" style="color:${ph.hdText}">${ph.label}</div>
        <div class="phase-hd-badge" style="color:${ph.hdText}">${ph.badge}</div>
      </div>
      <div class="phase-hd-right">
        <span class="phase-cnt" style="color:${ph.hdText}">${phDone}/${ph.items.length}</span>
        <span class="phase-chev ${isCol?'closed':''}" style="color:${ph.hdText}">›</span>
      </div>`;
    hd.onclick = () => { collapsed[pi] = !collapsed[pi]; renderCL(); };
    block.appendChild(hd);

    if(!isCol){
      const iw = document.createElement('div');
      iw.className = 'phase-items';

      ph.items.forEach((item, ii) => {
        const k = pi+'-'+ii, isDone = checks[k];
        const row = document.createElement('div');
        row.className = 'ci' + (isDone ? ' done' : '');
        row.dataset.pi = pi;
        row.dataset.ii = ii;

        // 드래그 핸들
        const handle = document.createElement('div');
        handle.className = 'drag-handle';
        handle.innerHTML = '<span></span><span></span><span></span>';
        handle.setAttribute('aria-label','드래그로 순서 변경');
        handle.addEventListener('touchstart', e => onDragStart(e, pi, ii), {passive:true});
        handle.addEventListener('mousedown', e => onDragStart(e, pi, ii));

        // 체크박스
        const chk = document.createElement('div');
        chk.className = 'chk';
        chk.style.borderColor = isDone ? ph.chkActive : ph.chkActive+'55';
        chk.style.background = isDone ? ph.chkActive : 'transparent';
        chk.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
        chk.onclick = () => { checks[k] = !checks[k]; renderCL(); };

        // 텍스트
        const body = document.createElement('div');
        body.className = 'ci-body';
        body.innerHTML = `<div class="ci-text">${item.t}</div>${item.n?`<div class="ci-note">${item.n}</div>`:''}`;
        body.onclick = () => { checks[k] = !checks[k]; renderCL(); };

        // 삭제
        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '×';
        del.setAttribute('aria-label','삭제');
        del.onclick = (e) => { e.stopPropagation(); deleteItem(pi, ii); };

        row.appendChild(handle);
        row.appendChild(chk);
        row.appendChild(body);
        row.appendChild(del);
        iw.appendChild(row);
      });

      // 새 항목 추가
      const addRow = document.createElement('div');
      addRow.className = 'add-item-row';
      addRow.innerHTML = `
        <input class="add-item-inp" id="ni-${pi}" placeholder="새 항목 추가..."
          onkeydown="if(event.key==='Enter'){event.preventDefault();addItem(${pi})}">
        <button class="add-item-btn" onclick="addItem(${pi})">추가</button>`;
      iw.appendChild(addRow);
      block.appendChild(iw);
    }
    wrap.appendChild(block);
  });

  const pct = tot ? Math.round(done/tot*100) : 0;
  document.getElementById('prog-txt').textContent = `${done} / ${tot} (${pct}%)`;
  document.getElementById('prog-fill').style.width = pct+'%';
}

let bRows=[
  {label:'웨딩홀 + 본식 사진·영상',color:'#534AB7',budget:'',actual:'',status:'미납'},
  {label:'스드메 (스튜디오·드레스·메이크업)',color:'#7F77DD',budget:'',actual:'',status:'미납'},
  {label:'신혼여행',color:'#AFA9EC',budget:'',actual:'',status:'미납'},
  {label:'예물·예단',color:'#3C3489',budget:'',actual:'',status:'미납'},
  {label:'청첩장',color:'#26215C',budget:'',actual:'',status:'미납'},
  {label:'기타',color:'#888780',budget:'',actual:'',status:'미납'},
];
const statuses=['미납','일부','완납'];
const stColors={미납:{bg:'#f0f0f0',c:'#555'},일부:{bg:'#FAEEDA',c:'#633806'},완납:{bg:'#E1F5EE',c:'#085041'}};

function renderBudget(){
  const list=document.getElementById('b-list');
  list.innerHTML='';
  bRows.forEach((r,i)=>{
    const sc=stColors[r.status];
    const card=document.createElement('div');
    card.className='b-card';
    card.innerHTML=`
      <div class="b-card-top">
        <div class="b-dot" style="background:${r.color}"></div>
        <span class="b-name">${r.label}</span>
        <button class="b-stat-btn" style="background:${sc.bg};color:${sc.c}" onclick="cycleStatus(${i})">${r.status}</button>
      </div>
      <div class="b-fields">
        <div class="b-field"><label>예상 (만원)</label>
          <input type="number" inputmode="numeric" placeholder="0" value="${r.budget}" oninput="bRows[${i}].budget=this.value;updBudget()"></div>
        <div class="b-field"><label>실제 (만원)</label>
          <input type="number" inputmode="numeric" placeholder="0" value="${r.actual}" oninput="bRows[${i}].actual=this.value;updBudget()"></div>
      </div>`;
    list.appendChild(card);
  });
  updBudget();
}
function cycleStatus(i){bRows[i].status=statuses[(statuses.indexOf(bRows[i].status)+1)%3];renderBudget()}
function addBRow(){bRows.push({label:'새 항목',color:'#AFA9EC',budget:'',actual:'',status:'미납'});renderBudget()}
function updBudget(){
  const tot=parseFloat(document.getElementById('tot-b').value)||0;
  let plan=0,actual=0;
  bRows.forEach(r=>{plan+=parseFloat(r.budget)||0;actual+=parseFloat(r.actual)||0;});
  const rem=tot-actual;
  document.getElementById('bh-tot').textContent=tot?tot.toLocaleString():'—';
  document.getElementById('bh-plan').textContent=plan.toLocaleString();
  document.getElementById('bh-actual').textContent=actual.toLocaleString();
  const el=document.getElementById('bh-rem');
  el.textContent=tot?rem.toLocaleString():'—';
  el.className='bhero-val'+(tot?(rem<0?' over':' ok'):'');
}

function sw(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
